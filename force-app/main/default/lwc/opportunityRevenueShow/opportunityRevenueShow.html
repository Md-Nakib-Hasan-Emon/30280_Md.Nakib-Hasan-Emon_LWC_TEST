<template>
    <lightning-card title="Forecast Manager">
        <template for:each={wiredOppsResult} for:item="it">

            <div key={it.Id} class="slds-box slds-m-vertical_x-small">
           
            <p>Name: <strong>{it.Name}</strong></p>
            <p>Amount: <strong>{it.amount}</strong></p>
            <p>Probability: <strong>{it.Probability}</strong></p>
            <p>Expected Revenue Overridden: <strong>{it.Expected_Revenue_Overridden__c}</strong></p>
            <lightning-button
label="button"
variant="Brand"
data-id={it.Id}
onclick={setExpectedRevenue}>
</lightning-button>
        
        </div>
        </template>
</lightning-card>

</template>
